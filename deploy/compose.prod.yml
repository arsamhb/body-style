# =============================================================================
# deploy/compose.prod.yml — the production stack. STANDALONE: it is not an
# overlay on the dev compose file.
# `make ship` copies it to /opt/ghahremani-bodystyle/compose.yml; deploy.sh runs it
# with --env-file /opt/ghahremani-bodystyle/.env, which holds secrets and APP_VERSION.
#
# Rules (see the infra repo's CONTRACT.md):
#   - images are <app>-<unit>:${APP_VERSION}, never :latest, never build:
#   - no `ports:` anywhere — Caddy reaches services over the `edge` network
#   - every long-running service has a healthcheck; deploy.sh waits on them
#   - no one-shot services (they would count as "not healthy")
#   - the database has no ports, a named volume, and a healthcheck
# =============================================================================
name: ghahremani-bodystyle   # must equal APP in the Makefile

# Hardening applied to every app service:
#   no-new-privileges  a process cannot gain privileges via setuid binaries
#   cap_drop ALL       no Linux capabilities
#   mem_limit          a leak or runaway job cannot take the whole VPS down
#   pids_limit         fork-bomb ceiling
# NOTE: `env_file` is deliberately NOT in this block. The Next.js container must
# not hold the database password or the JWT secrets — anything it renders
# server-side could leak them. Each service declares only what it needs.
x-app: &app
  restart: unless-stopped
  networks: [default, edge]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  mem_limit: 512m
  pids_limit: 256

x-node-health: &node-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  server:
    <<: *app
    image: ghahremani-bodystyle-server:${APP_VERSION}
    # the backend is the only service that gets the whole secret file
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Server → web: on-demand cache invalidation after content writes.
      REVALIDATE_URL: http://web:3000
      UPLOADS_DIR: /app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Uploaded media lives on local disk. The nightly backup covers MongoDB
      # only — see ADOPTION_REPORT.md (risks) before relying on this volume.
      - uploads-data:/app/uploads
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  web:
    <<: *app
    image: ghahremani-bodystyle-web:${APP_VERSION}
    # explicit list only — NEXT_PUBLIC_* are already baked in at build time
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://server:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  mongo:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    # mongod uses a thread per connection, and threads count as pids
    pids_limit: 1024
    environment:
      # The root user is created on the FIRST start of an empty volume only.
      # backup.sh reads these two names inside the container for mongodump.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    # never publish the database port

networks:
  edge:
    external: true

volumes:
  mongo-data:
  uploads-data:
